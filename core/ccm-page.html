<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code 供应商管理</title>
<style>
  /* 配色与 Windows 版 cc-manager.ps1 完全一致（浅色卡片 / 跟随系统深浅色） */
  :root {
    --bg: #F3F4F6; --card: #FFFFFF; --border: #E3E5EA; --text: #1F2328; --sub: #71767F;
    --inputBg: #FFFFFF; --inputBorder: #D9DDE3; --chipBg: #ECEEF2; --chipHover: #E0E3E9;
    --accent: #3B82F6; --accentHover: #2F76E4; --onAccent: #FFFFFF;
    --orange: #F97316; --orangeHover: #EA580C;
    --green: #10B981; --red: #EF4444; --redHover: #DC2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1D1E22; --card: #26282E; --border: #3A3D45; --text: #E6E8EC; --sub: #9CA3AF;
      --inputBg: #17181C; --inputBorder: #4A4E59; --chipBg: #33353D; --chipHover: #3E414A;
      --accent: #4C8DFF; --accentHover: #6AA1FF; --onAccent: #0B1220;
      --orange: #FB923C; --orangeHover: #FDBA74;
      --green: #34D399; --red: #F87171; --redHover: #FCA5A5;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13px; overflow: hidden;
  }

  /* 顶栏 */
  header {
    flex: none; display: flex; align-items: center; height: 64px;
    padding: 0 20px; border-bottom: 1px solid var(--border);
  }
  header .titles { margin-right: auto; }
  h1 { font-size: 20px; font-weight: 600; }
  .subtitle { font-size: 12.5px; color: var(--sub); margin-top: 3px; }

  /* 按钮体系（对应 WinForms 的 ghost / primary / orange / danger 四种） */
  button {
    font-family: inherit; font-size: 13px; border: none; border-radius: 6px;
    padding: 0 14px; height: 32px; cursor: pointer; white-space: nowrap;
    background: var(--chipBg); color: var(--text);
  }
  button:hover { background: var(--chipHover); }
  button.primary { background: var(--accent); color: var(--onAccent); }
  button.primary:hover { background: var(--accentHover); }
  button.orange { background: var(--orange); color: #fff; }
  button.orange:hover { background: var(--orangeHover); }
  button.danger:hover { background: var(--redHover); color: #fff; }
  .btn-gap { margin-left: 10px; }

  /* 卡片列表 */
  main { flex: 1; overflow-y: auto; padding: 8px 18px; }
  .card {
    display: flex; align-items: center; padding: 20px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 16px; cursor: pointer; user-select: none;
  }
  .card:hover { border-color: var(--accent); }
  .icon {
    flex: none; width: 44px; height: 44px; margin-right: 16px;
    border-radius: 10px; color: #fff; font-size: 19px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .info { min-width: 0; }
  .name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .chip-default {
    display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px;
    background: var(--accent); color: var(--onAccent); font-size: 11px; font-weight: 500;
    vertical-align: 1px;
  }
  .meta, .tok {
    font-size: 12.5px; color: var(--sub);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 480px;
  }
  .acts { margin-left: auto; display: flex; gap: 6px; }
  .acts button { width: 56px; height: 28px; padding: 0; font-size: 12.5px; }
  .empty { color: var(--sub); font-size: 12.5px; padding: 26px 4px; }

  /* 底部状态条 */
  footer {
    flex: none; display: flex; align-items: center; height: 34px;
    padding: 0 20px; border-top: 1px solid var(--border);
    font-size: 12.5px; color: var(--sub);
  }
  footer .status { margin-right: auto; }
  footer .status.ok { color: var(--green); }
  footer .status.bad { color: var(--red); }

  /* 编辑对话框（cc-switch 式：名称 + JSON 文件编辑） */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.35);
    display: flex; align-items: flex-start; justify-content: center;
    overflow-y: auto; padding: 6vh 16px; z-index: 10;
  }
  .overlay.hidden { display: none; }
  .dlg {
    width: 560px; max-width: 100%;
    background: var(--bg); color: var(--text);
    border: none; border-radius: 10px; padding: 24px;
    box-shadow: 0 16px 48px rgba(0,0,0,.25);
    margin-bottom: 6vh;
  }
  .dlg h2 { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
  .preset-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .preset-row .lbl { font-size: 12.5px; color: var(--sub); }
  .preset-row button { height: 30px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; color: var(--sub); margin-bottom: 5px; }
  .field input, textarea {
    width: 100%; background: var(--inputBg); border: 1px solid var(--inputBorder);
    border-radius: 8px; color: var(--text); font-family: inherit; outline: none;
  }
  .field input { height: 40px; padding: 0 12px; font-size: 14px; }
  .field input:focus, textarea:focus { border-color: var(--accent); }
  textarea {
    height: 340px; resize: vertical; padding: 12px; font-size: 12.5px; line-height: 1.6;
    font-family: Consolas, "Cascadia Code", Menlo, monospace; tab-size: 2; white-space: pre;
  }
  .hint { font-size: 12px; color: var(--sub); margin: 8px 0 0; }
  .hint.err { color: var(--red); }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .dlg-foot button { width: 96px; height: 34px; }
</style>
</head>
<body>

<header>
  <div class="titles">
    <h1>Claude Code 供应商</h1>
    <div class="subtitle">providers 配置管理 · 点击卡片编辑 · 启动用 cc / 右键菜单</div>
  </div>
  <button id="btn-settings">通用配置</button>
  <button id="btn-folder">打开目录</button>
  <button id="btn-add" class="orange btn-gap">＋ 新增供应商</button>
</header>

<main id="list"></main>

<footer>
  <span class="status" id="status"></span>
  <span id="dir"></span>
</footer>

<!-- 编辑/新增对话框：直接编辑 providers/<名称>.json 的内容 -->
<div class="overlay hidden" id="overlay">
  <div class="dlg">
    <h2 id="dlg-title">新增供应商</h2>
    <div class="field" id="row-name"><label>名称（文件名，命令行 cc &lt;名称&gt; 用它）</label><input id="f-name" placeholder="英文/数字/-/_，如 glm"></div>
    <div class="preset-row" id="row-preset">
      <span class="lbl">快速预设：</span>
      <button data-preset="official">官方</button>
      <button data-preset="glm">GLM</button>
      <button data-preset="deepseek">DeepSeek</button>
      <button data-preset="blank">空白</button>
    </div>
    <textarea id="f-json" spellcheck="false"></textarea>
    <div class="hint" id="f-hint">编辑的就是 ~/.claude/providers/&lt;名称&gt;.json 文件本身，保存前按 JSON 校验</div>
    <div class="dlg-foot">
      <button id="btn-cancel">取消</button>
      <button id="btn-save" class="primary">保存</button>
    </div>
  </div>
</div>

<script>
'use strict';

const $ = id => document.getElementById(id);
let providers = [];
let editing = null;            // null = 新增；对象 = 编辑
let dialogMode = 'provider';   // 'provider' | 'settings'（通用配置编辑）

// 厂商主色：与 wt tab / 状态栏配色一致（glm 系=青，deepseek 系=蓝，官方=绿，其余=黄）
function brandColor(p) {
  if (!p.url) return '#2ECC71';
  if (/^glm/i.test(p.name)) return '#00B8A9';
  if (/^deepseek/i.test(p.name)) return '#4D6FFF';
  return '#F1C40F';
}
const initial = name => name.charAt(0).toUpperCase();

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function api(path, body) {
  const resp = await fetch(path, body == null ? {} : {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const j = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(j.error || ('HTTP ' + resp.status));
  return j;
}

function setStatus(msg, cls) {
  const el = $('status');
  el.textContent = msg || '';
  el.className = 'status' + (cls ? ' ' + cls : '');
}

async function reload() {
  const j = await api('/api/providers').catch(e => {
    setStatus('加载失败：' + e.message, 'bad');
    throw e;
  });
  providers = j.providers;
  $('dir').textContent = '目录: ' + j.dir + (j.defaultName ? '  ·  默认: ' + j.defaultName : '');
  const list = $('list');
  list.innerHTML = '';
  if (!providers.length) {
    list.innerHTML = '<div class="empty">暂无配置 — 点右上「＋ 新增供应商」创建</div>';
    return;
  }
  for (const p of providers) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      `<div class="icon" style="background:${brandColor(p)}">${esc(initial(p.name))}</div>` +
      `<div class="info">` +
        `<div class="name">${esc(p.name)}${p.isDefault ? '<span class="chip-default">默认</span>' : ''}</div>` +
        `<div class="meta">${p.url ? esc(p.url) : '官方 API'} &nbsp;·&nbsp; ${esc(p.model)}</div>` +
        `<div class="tok">Token: ${esc(p.masked)}</div>` +
      `</div>` +
      `<div class="acts">` +
        `<button data-act="edit">编辑</button>` +
        `<button data-act="test">测试</button>` +
        `<button data-act="default" title="设为裸 claude 的默认配置">默认</button>` +
        `<button data-act="del" class="danger">删除</button>` +
      `</div>`;
    card.addEventListener('click', e => {
      const act = e.target.closest('button')?.dataset.act;
      if (act === 'test') return testProvider(p.name);
      if (act === 'del') return delProvider(p.name);
      if (act === 'default') return setProviderDefault(p.name);
      openDialog(p);   // 点卡片任意处 = 编辑
    });
    list.appendChild(card);
  }
}

// ---------- 对话框（cc-switch 式 JSON 编辑） ----------

function setHint(msg, isErr) {
  const el = $('f-hint');
  el.textContent = msg || '';
  el.className = 'hint' + (isErr ? ' err' : '');
}

function openDialog(p) {
  dialogMode = 'provider';
  editing = p || null;
  $('dlg-title').textContent = editing ? '编辑 — ' + editing.name : '新增供应商';
  $('row-name').style.display = '';
  $('row-preset').style.display = '';
  $('f-name').value = editing ? editing.name : '';
  $('f-json').value = editing
    ? JSON.stringify(editing.raw || { env: editing.env }, null, 2)
    : PRESETS.blank;
  setHint(editing
    ? `编辑的就是 providers/${editing.name}.json 文件本身，保存前按 JSON 校验`
    : '先点预设填模板，再把 Token 换成你的；保存前按 JSON 校验');
  $('overlay').classList.remove('hidden');
  $('f-name').focus();
}

// 通用配置：直接编辑全局 ~/.claude/settings.json（裸 claude 读的就是它）
async function openSettingsDialog() {
  dialogMode = 'settings';
  editing = null;
  const j = await api('/api/settings');
  $('dlg-title').textContent = '通用配置 — settings.json';
  $('row-name').style.display = 'none';
  $('row-preset').style.display = 'none';
  $('f-json').value = j.text;
  setHint('这是全局 ~/.claude/settings.json，裸启动的 claude（不带 --settings）读它；' +
          '要切换裸 claude 用的供应商，点卡片上的「默认」按钮即可（只改 env，其他键不动）');
  $('overlay').classList.remove('hidden');
  $('f-json').focus();
}
function closeDialog() { $('overlay').classList.add('hidden'); }

// 预设模板（与 install.sh / cc-setup.ps1 的 providers 模板一致）
const PRESETS = {
  official: {
    env: {
      ANTHROPIC_AUTH_TOKEN: "", ANTHROPIC_BASE_URL: "", ANTHROPIC_MODEL: "",
      "ANTHROPIC_DEFAULT_FABLE_MODEL": "", "ANTHROPIC_DEFAULT_FABLE_MODEL_NAME": "",
      "ANTHROPIC_DEFAULT_HAIKU_MODEL": "", "ANTHROPIC_DEFAULT_HAIKU_MODEL_NAME": "",
      "ANTHROPIC_DEFAULT_OPUS_MODEL": "", "ANTHROPIC_DEFAULT_OPUS_MODEL_NAME": "",
      "ANTHROPIC_DEFAULT_SONNET_MODEL": "", "ANTHROPIC_DEFAULT_SONNET_MODEL_NAME": "",
      API_TIMEOUT_MS: ""
    }
  },
  glm: {
    env: {
      ANTHROPIC_BASE_URL: "https://open.bigmodel.cn/api/anthropic",
      ANTHROPIC_AUTH_TOKEN: "在这里填入你的GLM_APIKey",
      ANTHROPIC_MODEL: "glm-5.3[1M]",
      "ANTHROPIC_DEFAULT_FABLE_MODEL": "glm-5.3[1M]",
      "ANTHROPIC_DEFAULT_FABLE_MODEL_NAME": "glm-5.3",
      "ANTHROPIC_DEFAULT_HAIKU_MODEL": "glm-5.3",
      "ANTHROPIC_DEFAULT_HAIKU_MODEL_NAME": "glm-5.3",
      "ANTHROPIC_DEFAULT_OPUS_MODEL": "glm-5.3[1M]",
      "ANTHROPIC_DEFAULT_OPUS_MODEL_NAME": "glm-5.3",
      "ANTHROPIC_DEFAULT_SONNET_MODEL": "glm-5.3[1M]",
      "ANTHROPIC_DEFAULT_SONNET_MODEL_NAME": "glm-5.3",
      API_TIMEOUT_MS: "3000000"
    }
  },
  deepseek: {
    env: {
      ANTHROPIC_BASE_URL: "https://api.deepseek.com/anthropic",
      ANTHROPIC_AUTH_TOKEN: "在这里填入你的DeepSeek_APIKey",
      ANTHROPIC_MODEL: "deepseek-v4-pro",
      "ANTHROPIC_DEFAULT_FABLE_MODEL": "deepseek-v4-pro[1M]",
      "ANTHROPIC_DEFAULT_FABLE_MODEL_NAME": "deepseek-v4-pro",
      "ANTHROPIC_DEFAULT_HAIKU_MODEL": "deepseek-v4-flash",
      "ANTHROPIC_DEFAULT_HAIKU_MODEL_NAME": "deepseek-v4-flash",
      "ANTHROPIC_DEFAULT_OPUS_MODEL": "deepseek-v4-pro[1M]",
      "ANTHROPIC_DEFAULT_OPUS_MODEL_NAME": "deepseek-v4-pro",
      "ANTHROPIC_DEFAULT_SONNET_MODEL": "deepseek-v4-pro",
      "ANTHROPIC_DEFAULT_SONNET_MODEL_NAME": "deepseek-v4-pro",
      API_TIMEOUT_MS: "3000000"
    }
  },
  blank: { env: { ANTHROPIC_BASE_URL: "", ANTHROPIC_AUTH_TOKEN: "", ANTHROPIC_MODEL: "" } },
};

document.querySelectorAll('[data-preset]').forEach(btn => {
  btn.addEventListener('click', () => {
    const tpl = PRESETS[btn.dataset.preset];
    $('f-json').value = JSON.stringify(tpl, null, 2);
    setHint('已填入模板——把 Token 换成你的，其他键按需改');
    $('f-json').focus();
  });
});

async function save() {
  setHint('保存中…');
  try {
    if (dialogMode === 'settings') {
      await api('/api/settings', { text: $('f-json').value });
      closeDialog();
      await reload();
      setStatus('通用配置已保存', 'ok');
      return;
    }
    await api('/api/save', {
      oldName: editing ? editing.name : null,
      name: $('f-name').value,
      text: $('f-json').value,
    });
    closeDialog();
    await reload();
  } catch (e) {
    setHint(e.message, true);   // JSON 语法 / 结构 / 名称问题都显示在编辑框下方
  }
}

async function setProviderDefault(name) {
  await api('/api/set-default', { name });
  await reload();
  setStatus(`${name} 已设为默认 — 新开的裸 claude 直接用`, 'ok');
}

async function delProvider(name) {
  if (!confirm(`确定删除 ${name} ？`)) return;
  await api('/api/delete', { name });
  await reload();
}

async function testProvider(name) {
  setStatus(`正在测试 ${name} …`);
  const { msg } = await api('/api/test', { name });
  setStatus(`${name}: ${msg}`, /不可达/.test(msg) ? 'bad' : /HTTP/.test(msg) ? 'ok' : '');
}

// ---------- 事件绑定 ----------

$('btn-add').addEventListener('click', () => openDialog(null));
$('btn-settings').addEventListener('click', () =>
  openSettingsDialog().catch(e => setStatus('读取 settings.json 失败：' + e.message, 'bad')));
$('btn-cancel').addEventListener('click', closeDialog);
$('btn-save').addEventListener('click', save);
$('overlay').addEventListener('mousedown', e => { if (e.target === $('overlay')) closeDialog(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDialog(); });
$('btn-folder').addEventListener('click', () =>
  api('/api/open-folder', {}).catch(e => setStatus('打开目录失败：' + e.message, 'bad')));
// Tab 在编辑区插入缩进而不是跳出焦点
$('f-json').addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const t = e.target, s = t.selectionStart;
    t.setRangeText('  ', s, t.selectionEnd, 'end');
  }
});

reload();
</script>
</body>
</html>
